name: CI

# A tag push would otherwise run this whole matrix a second time, on top of the release
# workflow the tag already triggers, so pushes are filtered to `main`. A `workflow_dispatch`
# exists to run the macOS leg, which is dispatch-only while macOS is deferred
# (implementation decision 7): the push run of the same commit already has the ubuntu and windows
# results, so a dispatch skips that matrix unless it is asked for.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: 'Also run the ubuntu/windows matrix; a push already covers it'
        type: boolean
        default: false

permissions:
  contents: read

# One group per event and ref: a newer push cancels the superseded push run, a newer
# dispatch the superseded dispatch, and a dispatch never cancels the push run of the
# commit it is checking, which one group shared by both events would make it do.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    if: github.event_name != 'workflow_dispatch' || inputs.full
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:links
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Smoke the bundle
        run: node dist/handoff-mcp.cjs --version

  # macOS is deferred (implementation decision 7) and its minutes cost 10x, so this leg runs
  # only when it is dispatched by hand; T-060 makes it run on every push.
  check-macos:
    name: macos-latest · node ${{ matrix.node }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:links
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Smoke the bundle
        run: node dist/handoff-mcp.cjs --version
