name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:links
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Smoke the bundle
        run: node dist/handoff-mcp.cjs --version

  # macOS is deferred (TASKS.md §0.4 item 7) and its minutes cost 10x, so this leg runs
  # only when it is dispatched by hand.
  check-macos:
    name: macos-latest · node ${{ matrix.node }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:links
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Smoke the bundle
        run: node dist/handoff-mcp.cjs --version
