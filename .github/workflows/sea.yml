name: SEA

# Builds the standalone executables of TECHNICAL-DESIGN §3.5 (SRV-24) and smokes each one
# on the platform it was built for. Cross-building is impossible: the preparation blob is
# injected into the Node binary of the runner, so every asset needs its own runner.
#
# macOS is deferred (implementation decision 7) and its minutes cost 10x, so the two darwin
# legs run only when they are dispatched by hand. The Intel runner label is a dispatch
# input because that image is the one that gets retired from under us: `macos-13`, which
# the design-era documentation still names, no longer receives a runner at all — a job
# asking for it stays queued until it times out. If `macos-15-intel` goes the same way,
# dispatch again with the current label instead of editing this file.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      macos_x64_runner:
        description: Runner label for the darwin-x64 leg
        default: macos-15-intel
        required: false

permissions:
  contents: read

# One group per event and ref, as in `ci.yml`: a dispatch, which is how the darwin legs
# run, must not cancel the push run of the commit it is checking.
concurrency:
  group: sea-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  win32-x64:
    name: win32-x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:sea
      - run: pnpm smoke:sea

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sea-win32-x64
          path: |
            dist/sea/handoff-mcp-*-win32-x64.exe
            dist/sea/handoff-mcp-*-win32-x64-notices.md
          if-no-files-found: error

  darwin-arm64:
    name: darwin-arm64
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:sea
      - run: pnpm smoke:sea

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sea-darwin-arm64
          path: |
            dist/sea/handoff-mcp-*-darwin-arm64
            dist/sea/handoff-mcp-*-darwin-arm64-notices.md
          if-no-files-found: error

  darwin-x64:
    name: darwin-x64
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.macos_x64_runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:sea
      - run: pnpm smoke:sea

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sea-darwin-x64
          path: |
            dist/sea/handoff-mcp-*-darwin-x64
            dist/sea/handoff-mcp-*-darwin-x64-notices.md
          if-no-files-found: error
