# Release watch: the assumption canaries and E2E-8 against the real agents
# (TECHNICAL-DESIGN §11.5, implementation decisions 3 and 9).
#
# `workflow_dispatch` only, and deliberately so. There is no schedule because the canary
# needs credentials nobody has provisioned (T-024 is deferred): until then the owner runs
# `pnpm canary` locally after every agent update and records the result in
# `docs/agent-facts.md`. The workflow exists so that turning a secret on is one step and
# not one afternoon, and each agent's job **skips gracefully** rather than failing when its
# secret is absent — a red run that only means "no key" teaches nobody anything.
#
# Four agents, four jobs, four credentials: Claude Code runs on `ANTHROPIC_API_KEY`, Codex
# (T-066) on `OPENAI_API_KEY`, OpenCode (T-074) on `OPENROUTER_API_KEY`, Kilo Code (T-081) on
# `KILO_API_KEY`, and each job runs only its own agent's scenarios.
#
# This repository runs the canaries the server can run alone. Everything that needs the
# overlay — E2E-1..7, 9..11 — lives in `handoff-app`'s own canary workflow.
name: Canary

on:
  workflow_dispatch:
    inputs:
      macos:
        description: 'Also run on macOS (10x minute multiplier)'
        type: boolean
        default: false
      macos_runner:
        description: 'macOS runner label'
        type: string
        default: macos-15
      model:
        description: 'Model to run the Claude Code canaries against'
        type: string
        default: sonnet
      codex_model:
        description: 'Model to run the Codex canaries against'
        type: string
        default: gpt-5.6-luna
      opencode_model:
        description: 'Model to run the OpenCode canaries against'
        type: string
        default: openrouter/thinkingmachines/inkling-small:free
      kilo_code_model:
        description: 'Model to run the Kilo Code canaries against (the image scenario keeps its own)'
        type: string
        default: kilo/kilo-auto/free
      open_issue:
        description: 'Open an issue when a scenario fails'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: canary
  cancel-in-progress: false

jobs:
  # Which agent versions are current, and which runners this dispatch asked for.
  #
  # There is no changelog feed (A-22), so the npm dist-tags are the signal and the two
  # `test/canary/last-*-version` files are what they are compared against. A difference is
  # reported and never fails the job: the run that follows says whether it matters.
  #
  # The runner list is built here rather than written as a matrix, because macOS minutes
  # cost ten times as much (implementation decision 7) and must stay opt-in even inside a workflow that
  # is already dispatch-only. The label is an input and not a literal: `macos-13` stopped
  # receiving runners with no error at all (T-009), and changing a label must not mean
  # editing this file.
  plan:
    name: Published versions and runners
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.version.outputs.published }}
      pinned: ${{ steps.version.outputs.pinned }}
      changed: ${{ steps.version.outputs.changed }}
      codex_published: ${{ steps.codex.outputs.published }}
      codex_pinned: ${{ steps.codex.outputs.pinned }}
      opencode_published: ${{ steps.opencode.outputs.published }}
      opencode_pinned: ${{ steps.opencode.outputs.pinned }}
      kilo_code_published: ${{ steps.kilo_code.outputs.published }}
      kilo_code_pinned: ${{ steps.kilo_code.outputs.pinned }}
      runners: ${{ steps.runners.outputs.list }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - id: version
        shell: bash
        run: |
          published="$(npm view @anthropic-ai/claude-code dist-tags.latest)"
          pinned="$(tr -d '[:space:]' < test/canary/last-claude-version)"
          echo "published=$published" >> "$GITHUB_OUTPUT"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          if [ "$published" = "$pinned" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Claude Code is still \`$pinned\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Claude Code moved from \`$pinned\` to \`$published\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      - id: codex
        shell: bash
        run: |
          published="$(npm view @openai/codex dist-tags.latest)"
          pinned="$(tr -d '[:space:]' < test/canary/last-codex-version)"
          echo "published=$published" >> "$GITHUB_OUTPUT"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          if [ "$published" = "$pinned" ]; then
            echo "Codex is still \`$pinned\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Codex moved from \`$pinned\` to \`$published\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      - id: opencode
        shell: bash
        run: |
          published="$(npm view opencode-ai dist-tags.latest)"
          pinned="$(tr -d '[:space:]' < test/canary/last-opencode-version)"
          echo "published=$published" >> "$GITHUB_OUTPUT"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          if [ "$published" = "$pinned" ]; then
            echo "OpenCode is still \`$pinned\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "OpenCode moved from \`$pinned\` to \`$published\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      - id: kilo_code
        shell: bash
        run: |
          published="$(npm view @kilocode/cli dist-tags.latest)"
          pinned="$(tr -d '[:space:]' < test/canary/last-kilo-code-version)"
          echo "published=$published" >> "$GITHUB_OUTPUT"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          if [ "$published" = "$pinned" ]; then
            echo "Kilo Code is still \`$pinned\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Kilo Code moved from \`$pinned\` to \`$published\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      - id: runners
        shell: bash
        env:
          WITH_MACOS: ${{ inputs.macos }}
          MACOS_RUNNER: ${{ inputs.macos_runner }}
        run: |
          if [ "$WITH_MACOS" = "true" ]; then
            list="[\"windows-latest\", \"$MACOS_RUNNER\"]"
          else
            list='["windows-latest"]'
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "Runners: $list" >> "$GITHUB_STEP_SUMMARY"

  canary:
    name: Claude Code · ${{ matrix.os }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.runners) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      # No secret, no run. This is the deferred state of T-024 and it is not a failure:
      # every later step is skipped and the summary says why.
      - id: secret
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "ANTHROPIC_API_KEY is not configured: the canaries were skipped (T-024)." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.secret.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      # The canary runs the built bundle, which is what an installed server is.
      - if: steps.secret.outputs.present == 'true'
        run: pnpm build

      - name: Install the published Claude Code
        if: steps.secret.outputs.present == 'true'
        run: npm install --global @anthropic-ai/claude-code@${{ needs.plan.outputs.published }}

      - name: Run the canaries
        if: steps.secret.outputs.present == 'true'
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HANDOFF_CANARY_MODEL: ${{ inputs.model }}
        run: pnpm canary -- --agent claude-code

      - name: Report
        if: always() && steps.secret.outputs.present == 'true'
        shell: bash
        run: node build/canary-report.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the report
        if: always() && steps.secret.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canary-claude-code-${{ matrix.os }}
          path: test/canary/results/last-run.json
          if-no-files-found: ignore

  # The same shape for Codex (T-066). `codex login --with-api-key` reads the key from stdin,
  # so it is never on a command line; the harness itself adds the isolation flags
  # (`--ignore-user-config`, apps and plugins off) to every `codex exec` it starts.
  codex:
    name: Codex · ${{ matrix.os }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.runners) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - id: secret
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY is not configured: the Codex canaries were skipped (T-066)." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.secret.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - if: steps.secret.outputs.present == 'true'
        run: pnpm build

      - name: Install the published Codex
        if: steps.secret.outputs.present == 'true'
        run: npm install --global @openai/codex@${{ needs.plan.outputs.codex_published }}

      - name: Log Codex in with the API key
        if: steps.secret.outputs.present == 'true'
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: printenv OPENAI_API_KEY | codex login --with-api-key

      - name: Run the Codex canaries
        if: steps.secret.outputs.present == 'true'
        shell: bash
        env:
          HANDOFF_CANARY_CODEX_MODEL: ${{ inputs.codex_model }}
        run: pnpm canary -- --agent codex

      - name: Report
        if: always() && steps.secret.outputs.present == 'true'
        shell: bash
        run: node build/canary-report.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the report
        if: always() && steps.secret.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canary-codex-${{ matrix.os }}
          path: test/canary/results/last-run.json
          if-no-files-found: ignore

  # The same shape for OpenCode (T-074). Its OpenRouter provider reads `OPENROUTER_API_KEY`
  # from the environment — the variable OpenCode's own provider catalogue names — so there is
  # no login step and the key is never on a command line. The harness itself isolates every
  # run from the user's OpenCode configuration and deletes the session a run leaves behind.
  opencode:
    name: OpenCode · ${{ matrix.os }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.runners) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - id: secret
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "OPENROUTER_API_KEY is not configured: the OpenCode canaries were skipped (T-074)." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.secret.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - if: steps.secret.outputs.present == 'true'
        run: pnpm build

      - name: Install the published OpenCode
        if: steps.secret.outputs.present == 'true'
        run: npm install --global opencode-ai@${{ needs.plan.outputs.opencode_published }}

      - name: Run the OpenCode canaries
        if: steps.secret.outputs.present == 'true'
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HANDOFF_CANARY_OPENCODE_MODEL: ${{ inputs.opencode_model }}
        run: pnpm canary -- --agent opencode

      - name: Report
        if: always() && steps.secret.outputs.present == 'true'
        shell: bash
        run: node build/canary-report.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the report
        if: always() && steps.secret.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canary-opencode-${{ matrix.os }}
          path: test/canary/results/last-run.json
          if-no-files-found: ignore

  # The same shape for Kilo Code (T-081), whose CLI is published as `@kilocode/cli`. The Kilo
  # Gateway, the provider the canaries run on (free models, T-080), reads `KILO_API_KEY` from the
  # environment, one of the names Kilo's own binary declares, so the key goes into the step's
  # environment and no login command ever sees it. The harness itself isolates every run from
  # the user's Kilo configuration, starts the native binary past the npm launcher, and deletes
  # the session a run leaves behind. The VS Code surface is not run here: no script can type a
  # task into its panel.
  kilo-code:
    name: Kilo Code · ${{ matrix.os }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.runners) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - id: secret
        shell: bash
        env:
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
        run: |
          if [ -z "${KILO_API_KEY:-}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "KILO_API_KEY is not configured: the Kilo Code canaries were skipped (T-081)." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.secret.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - if: steps.secret.outputs.present == 'true'
        run: pnpm build

      - name: Install the published Kilo CLI
        if: steps.secret.outputs.present == 'true'
        run: npm install --global @kilocode/cli@${{ needs.plan.outputs.kilo_code_published }}

      - name: Run the Kilo Code canaries
        if: steps.secret.outputs.present == 'true'
        shell: bash
        env:
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          HANDOFF_CANARY_KILO_CODE_MODEL: ${{ inputs.kilo_code_model }}
        run: pnpm canary -- --agent kilo-code

      - name: Report
        if: always() && steps.secret.outputs.present == 'true'
        shell: bash
        run: node build/canary-report.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the report
        if: always() && steps.secret.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canary-kilo-code-${{ matrix.os }}
          path: test/canary/results/last-run.json
          if-no-files-found: ignore

  # The point of a release watch is to be told. The issue names the versions and the failing
  # assertions; the transcript is not in it, because a transcript is a conversation and this
  # repository is public.
  issue:
    name: Open an issue for the failing assertions
    needs: [plan, canary, codex, opencode, kilo-code]
    if: failure() && inputs.open_issue
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          pattern: canary-*
          path: reports

      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED: ${{ needs.plan.outputs.published }}
          PINNED: ${{ needs.plan.outputs.pinned }}
          CODEX_PUBLISHED: ${{ needs.plan.outputs.codex_published }}
          CODEX_PINNED: ${{ needs.plan.outputs.codex_pinned }}
          OPENCODE_PUBLISHED: ${{ needs.plan.outputs.opencode_published }}
          OPENCODE_PINNED: ${{ needs.plan.outputs.opencode_pinned }}
          KILO_CODE_PUBLISHED: ${{ needs.plan.outputs.kilo_code_published }}
          KILO_CODE_PINNED: ${{ needs.plan.outputs.kilo_code_pinned }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Claude Code \`$PUBLISHED\` (pinned in \`test/canary/last-claude-version\`: \`$PINNED\`)."
            echo "Codex \`$CODEX_PUBLISHED\` (pinned in \`test/canary/last-codex-version\`: \`$CODEX_PINNED\`)."
            echo "OpenCode \`$OPENCODE_PUBLISHED\` (pinned in \`test/canary/last-opencode-version\`: \`$OPENCODE_PINNED\`)."
            echo "Kilo Code \`$KILO_CODE_PUBLISHED\` (pinned in \`test/canary/last-kilo-code-version\`: \`$KILO_CODE_PINNED\`)."
            echo
            echo "Run: $RUN_URL"
            echo
            found=0
            for report in $(find reports -name last-run.json 2>/dev/null | sort); do
              found=1
              echo "### $report"
              echo
              node build/canary-report.mjs "$report"
              echo
            done
            if [ "$found" = "0" ]; then
              echo "No report was produced: the run failed before the canaries started."
            fi
          } > body.md
          gh issue create \
            --title "Canary: assumptions failing against Claude Code $PUBLISHED, Codex $CODEX_PUBLISHED, OpenCode $OPENCODE_PUBLISHED or Kilo Code $KILO_CODE_PUBLISHED" \
            --body-file body.md
