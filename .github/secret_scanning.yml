# GitHub secret scanning: the alerts of the repository and its push protection.
#
# These paths hold synthetic keys on purpose: the recall corpus of the certain-secret patterns,
# the examples inside the pattern file, and the tests that plant a key to prove it never leaks.
# None of them has ever been valid anywhere (`fixtures/secrets/positive.txt` says how they are
# made). Everything else is still scanned.
paths-ignore:
  - 'fixtures/secrets/**'
  - 'patterns/certain-secrets.v1.json'
  - 'test/**'
